x-spark-env: &spark-env
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

x-airflow-env: &airflow-env
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  AIRFLOW_CONN_SPARK_DEFAULT: "spark://spark-master:7077?deploy_mode=client"
  VALKEY_PASSWORD: ${VALKEY_PASSWORD}
  VALKEY_NAME: ${VALKEY_NAME}

services:
  # ==== MINIO ====
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - bigdata
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==== SPARK ====
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-master
    restart: always
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      <<: *spark-env
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata
    volumes:
      - ./spark_jobs:/opt/spark/spark_jobs
      - ./data:/opt/spark/data

  spark-worker-1:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker-1
    restart: always
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
      SPARK_PUBLIC_DNS: ${SPARK_PUBLIC_IP}
      SPARK_WORKER_WEBUI_PORT: 8081
      <<: *spark-env
    ports:
      - "8081:8081"
    networks:
      - bigdata
    volumes:
      - ./spark_jobs:/opt/spark/spark_jobs
      - ./data:/opt/spark/data

  spark-worker-2:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    container_name: spark-worker-2
    restart: always
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 4g
      SPARK_PUBLIC_DNS: ${SPARK_PUBLIC_IP}
      SPARK_WORKER_WEBUI_PORT: 8082
      <<: *spark-env
    ports:
      - "8082:8082"
    networks:
      - bigdata
    volumes:
      - ./spark_jobs:/opt/spark/spark_jobs
      - ./data:/opt/spark/data

  # ==== AIRFLOW ====
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    networks:
      - bigdata
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-init
    user: "${AIRFLOW_UID}:0"
    restart: "no"
    networks:
      - bigdata
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME}
      AIRFLOW_FIRSTNAME: ${AIRFLOW_FIRSTNAME}
      AIRFLOW_LASTNAME: ${AIRFLOW_LASTNAME}
      AIRFLOW_EMAIL: ${AIRFLOW_EMAIL}
      AIRFLOW_ROLE: ${AIRFLOW_ROLE}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username $$AIRFLOW_USERNAME
      --firstname $$AIRFLOW_FIRSTNAME
      --lastname $$AIRFLOW_LASTNAME
      --email $$AIRFLOW_EMAIL
      --role $$AIRFLOW_ROLE
      --password $$AIRFLOW_ADMIN_PASSWORD"

  airflow-api-server:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-api-server
    user: "${AIRFLOW_UID}:0"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    ports:
      - "8083:8080"
    networks:
      - bigdata
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./spark_jobs:/opt/airflow/spark_jobs:ro
    command: api-server

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-scheduler
    user: "${AIRFLOW_UID}:0"
    restart: unless-stopped
    networks:
      - bigdata
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./spark_jobs:/opt/airflow/spark_jobs:ro
    command: scheduler

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-dag-processor
    user: "${AIRFLOW_UID}:0"
    restart: unless-stopped
    networks:
      - bigdata
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./spark_jobs:/opt/airflow/spark_jobs:ro
    command: dag-processor

  # ==== VALKEY + SENTINEL ====
  valkey-primary:
    image: valkey/valkey:latest
    container_name: valkey-primary
    restart: unless-stopped
    networks:
      - bigdata
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --masterauth ${VALKEY_PASSWORD}
      --appendonly yes
    volumes:
      - ./data/valkey-primary:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}

  valkey-replica:
    image: valkey/valkey:latest
    container_name: valkey-replica
    restart: unless-stopped
    networks:
      - bigdata
    depends_on:
      valkey-primary:
        condition: service_healthy
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --masterauth ${VALKEY_PASSWORD}
      --replicaof valkey-primary 6379
      --appendonly yes
    volumes:
      - ./data/valkey-replica:/data
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}

  valkey-sentinel-1:
    image: valkey/valkey:latest
    container_name: valkey-sentinel-1
    restart: unless-stopped
    depends_on:
      - valkey-primary
      - valkey-replica
    ports:
      - "26379:26379"
    networks:
      - bigdata
    command: >
      sh -c "printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor mymaster valkey-primary 6379 2\nsentinel auth-pass mymaster %s\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' \"$$VALKEY_PASSWORD\" > /tmp/sentinel.conf
      && valkey-sentinel /tmp/sentinel.conf"
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}

  valkey-sentinel-2:
    image: valkey/valkey:latest
    container_name: valkey-sentinel-2
    restart: unless-stopped
    depends_on:
      - valkey-primary
      - valkey-replica
    ports:
      - "26380:26379"
    networks:
      - bigdata
    command: >
      sh -c "printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor mymaster valkey-primary 6379 2\nsentinel auth-pass mymaster %s\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' \"$$VALKEY_PASSWORD\" > /tmp/sentinel.conf
      && valkey-sentinel /tmp/sentinel.conf"
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}

  valkey-sentinel-3:
    image: valkey/valkey:latest
    container_name: valkey-sentinel-3
    restart: unless-stopped
    depends_on:
      - valkey-primary
      - valkey-replica
    ports:
      - "26381:26379"
    networks:
      - bigdata
    command: >
      sh -c "printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor mymaster valkey-primary 6379 2\nsentinel auth-pass mymaster %s\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\nsentinel parallel-syncs mymaster 1\n' \"$$VALKEY_PASSWORD\" > /tmp/sentinel.conf
      && valkey-sentinel /tmp/sentinel.conf"
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}

  # ==== ICEBERG ====
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: iceberg-rest
    restart: unless-stopped
    ports:
      - "8181:8181"
    networks:
      - bigdata
    environment:
      CATALOG_WAREHOUSE: "s3a://warehouse/"
      CATALOG_IO__IMPL: "org.apache.iceberg.aws.s3.S3FileIO"
      CATALOG_S3_ENDPOINT: "http://minio:9000"
      CATALOG_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      CATALOG_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio:
        condition: service_healthy

networks:
  bigdata:
    driver: bridge
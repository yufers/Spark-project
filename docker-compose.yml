services:
  # --- Object Storage (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Spark Master ---
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    restart: always
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080" # Web UI Master
      - "7077:7077" # Master RPC URL
    volumes:
      - ./spark_jobs:/opt/spark/spark_jobs
      - ./data:/opt/spark/data

  # --- Spark Worker 1 ---
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    restart: always
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
    ports:
      - "8081:8081" # Web UI Worker 1
    volumes:
      - ./spark_jobs:/opt/spark/spark_jobs
      - ./data:/opt/spark/data

  # --- Spark Worker 2 ---
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    restart: always
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
    ports:
      - "8082:8082" # Web UI Worker 2
    volumes:
      - ./spark_jobs:/opt/spark/spark_jobs
      - ./data:/opt/spark/data